          display: Recurso
          fields:
            -
              handle: resource_title
              field:
                type: text
                display: Título
            -
              handle: resource_url
              field:
                type: link
                display: URL
            -
              handle: resource_description
              field:
                type: text
                display: Descripción
  -
    handle: resources_language
    field:
      type: replicator
      display: 'Recursos - Habilidades de Inglés'
      instructions: 'Enlaces mostrados si esta es la categoría más débil.'
